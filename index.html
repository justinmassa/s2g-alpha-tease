<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Where is the alpha in generative AI? · Remix Partners for S2G</title>
<meta name="description" content="A scenario reading of S2G's Financing Reality, applied to the alpha question in generative AI. Prepared by Remix Partners." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1D1D1C;
    --ink-soft: #3a3a39;
    --ink-muted: rgba(255,255,255,0.62);
    --ink-line: rgba(255,255,255,0.14);
    --paper: #FFFFFF;
    --paper-deep: #f2f3f5;
    --accent: #E0F61F;
    --accent-strong: #c8db00;
    --sage: #5D6E96;
    --slate: #A77E5A;
    --mauve: #A04473;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    color: var(--paper);
    background: var(--ink);
    line-height: 1.55;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--accent); color: var(--ink); }

  /* Layout */
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 28px; }
  .narrow { max-width: 760px; }
  section { padding: 110px 0; position: relative; }
  section.tight { padding: 70px 0; }

  /* Typography */
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; line-height: 1.05; }
  .display { font-size: clamp(2.6rem, 6.5vw, 5.4rem); font-weight: 400; line-height: 0.98; letter-spacing: -0.03em; }
  h2.section-title { font-size: clamp(2rem, 4vw, 3.3rem); line-height: 1.04; }
  h3 { font-size: clamp(1.55rem, 2.6vw, 2.1rem); line-height: 1.1; }
  h4 { font-size: 1.25rem; line-height: 1.25; font-weight: 500; }
  p { margin-bottom: 1.1em; color: var(--ink-muted); font-size: 1.02rem; line-height: 1.68; }
  p strong, .body strong { color: var(--paper); font-weight: 600; }
  p em { color: rgba(255,255,255,0.78); }
  .lead { font-size: 1.15rem; color: rgba(255,255,255,0.78); line-height: 1.6; }
  .lead-large { font-size: 1.35rem; line-height: 1.55; color: rgba(255,255,255,0.88); font-weight: 300; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
    display: inline-block;
  }
  .eyebrow.muted { color: rgba(255,255,255,0.5); }
  .meta-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .accent-text { color: var(--accent); }
  .serif { font-family: var(--serif); }

  /* Top bar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: rgba(29,29,28,0.65);
    border-bottom: 1px solid var(--ink-line);
  }
  .topbar .brand {
    font-family: var(--mono); font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--paper);
  }
  .topbar .for {
    font-family: var(--mono); font-size: 0.7rem;
    letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55);
  }
  .topbar .for span { color: var(--accent); }

  /* Hero */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
    padding-top: 80px; padding-bottom: 60px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -10%; right: -15%;
    width: 60vw; height: 60vw;
    background:
      radial-gradient(circle at 30% 30%, rgba(224,246,31,0.08), transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -20%; left: -10%;
    width: 70vw; height: 70vw;
    background:
      radial-gradient(circle at 70% 60%, rgba(93,110,150,0.10), transparent 55%);
    pointer-events: none; z-index: 0;
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero h1 { max-width: 14ch; margin-bottom: 1.5rem; }
  .hero .sub {
    font-size: 1.2rem; max-width: 56ch; line-height: 1.55;
    color: rgba(255,255,255,0.72); font-weight: 300;
    margin-bottom: 3rem;
  }
  .hero-meta {
    display: flex; gap: 3rem; flex-wrap: wrap;
    padding-top: 2rem; border-top: 1px solid var(--ink-line);
    max-width: 720px;
  }
  .hero-meta dt {
    font-family: var(--mono); font-size: 0.68rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 0.4rem;
  }
  .hero-meta dd {
    font-size: 0.95rem; color: var(--paper); font-weight: 400;
  }
  .scroll-hint {
    position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 0.65rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    z-index: 1;
  }
  .scroll-hint::after {
    content: ''; display: block; width: 1px; height: 32px;
    background: rgba(255,255,255,0.3); margin: 12px auto 0;
  }

  /* Sections shared */
  .section-head {
    display: flex; flex-direction: column; gap: 0.5rem;
    margin-bottom: 3.5rem;
    max-width: 880px;
  }
  .section-head .lead {
    margin-top: 1.2rem; max-width: 65ch;
  }

  /* Frame section */
  .frame { background: var(--ink); border-top: 1px solid var(--ink-line); }
  .frame-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4rem;
    align-items: start;
  }
  .frame-grid blockquote {
    font-family: var(--serif); font-size: 1.45rem; line-height: 1.32;
    font-weight: 300; letter-spacing: -0.01em;
    color: rgba(255,255,255,0.92);
    border-left: 2px solid var(--accent);
    padding-left: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .frame-grid cite {
    font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.5); font-style: normal;
  }

  /* The formula */
  .formula-band {
    background: var(--accent);
    color: var(--ink);
    padding: 90px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .formula-band::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 18% 30%, rgba(29,29,28,0.05), transparent 50%),
      radial-gradient(circle at 82% 70%, rgba(29,29,28,0.04), transparent 50%);
  }
  .formula-band .eyebrow { color: var(--ink); }
  .formula {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(2rem, 4.8vw, 3.6rem);
    line-height: 1.08; letter-spacing: -0.02em;
    color: var(--ink);
    max-width: 18ch; margin: 0 auto;
    position: relative; z-index: 1;
  }
  .formula em { font-style: italic; }
  .formula .op { font-style: normal; color: var(--ink-soft); }
  .formula-source {
    margin-top: 2rem;
    font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(29,29,28,0.65);
  }

  /* Predetermined elements */
  .predets { background: #232322; border-top: 1px solid var(--ink-line); }
  .predets-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem 2.5rem;
    margin-top: 2rem;
  }
  .predet {
    padding: 1.75rem 0 1.75rem 1.5rem;
    border-left: 2px solid var(--ink-line);
    transition: border-color 0.25s;
  }
  .predet:hover { border-left-color: var(--accent); }
  .predet h4 {
    font-family: var(--sans); font-weight: 600; font-size: 0.95rem;
    color: var(--paper); margin-bottom: 0.6rem; letter-spacing: 0;
  }
  .predet p { font-size: 0.92rem; margin-bottom: 0; line-height: 1.55; }
  .predet .num {
    font-family: var(--mono); font-size: 0.7rem;
    letter-spacing: 0.12em; color: var(--accent); margin-bottom: 0.5rem;
    display: block;
  }

  /* Axes section */
  .axes { background: var(--ink); border-top: 1px solid var(--ink-line); }
  .axes-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;
    margin-top: 2rem;
  }
  .axis-card {
    padding: 2.5rem; border: 1px solid var(--ink-line);
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .axis-card .meta-label { margin-bottom: 0.75rem; }
  .axis-card h3 { margin-bottom: 1.5rem; }
  .axis-poles {
    display: flex; justify-content: space-between; gap: 2rem;
    margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--ink-line);
  }
  .pole { flex: 1; }
  .pole .pole-name {
    font-family: var(--mono); font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 0.5rem;
  }
  .pole .pole-desc { font-size: 0.88rem; line-height: 1.5; color: var(--ink-muted); }

  /* The 2x2 matrix */
  .matrix-section {
    background: var(--paper); color: var(--ink);
    padding: 120px 0;
  }
  .matrix-section .eyebrow { color: var(--ink); opacity: 0.65; }
  .matrix-section h2 { color: var(--ink); }
  .matrix-section .lead { color: var(--ink-soft); }
  .matrix-section p { color: var(--ink-soft); }
  .matrix-wrap {
    margin: 4rem auto 0; max-width: 940px; position: relative;
  }
  .matrix-axes {
    position: relative; padding: 60px 0 60px 80px;
  }
  .axis-y {
    position: absolute; left: 0; top: 60px; bottom: 60px;
    width: 60px; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center;
  }
  .axis-y .label {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family: var(--mono); font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink);
  }
  .axis-x {
    display: flex; justify-content: space-between; padding-left: 80px;
    margin-top: 16px;
  }
  .axis-x .label {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink);
  }
  .axis-name {
    font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(29,29,28,0.5);
    margin-top: 6px; margin-bottom: 14px;
  }
  .matrix-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--ink); position: relative;
  }
  .quadrant {
    padding: 2.5rem 2rem; min-height: 280px;
    position: relative; display: flex; flex-direction: column;
    text-decoration: none; color: inherit;
    transition: background 0.2s;
    border-right: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
    cursor: pointer;
  }
  .quadrant:nth-child(2n) { border-right: none; }
  .quadrant:nth-child(n+3) { border-bottom: none; }
  .quadrant:hover { background: var(--accent); }
  .quadrant:hover .q-id, .quadrant:hover .q-name, .quadrant:hover .q-sub, .quadrant:hover .q-arrow { color: var(--ink); }
  .q-id {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.2em; color: rgba(29,29,28,0.45);
    margin-bottom: 0.75rem;
  }
  .q-name {
    font-family: var(--serif); font-size: 1.95rem; font-weight: 400;
    line-height: 1.05; letter-spacing: -0.02em; color: var(--ink);
    margin-bottom: 1rem;
  }
  .q-sub {
    font-size: 0.95rem; color: var(--ink-soft); line-height: 1.45;
    flex: 1;
  }
  .q-arrow {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(29,29,28,0.55);
    margin-top: 1.25rem;
  }
  .q-arrow::after { content: ' →'; }
  .quadrant.featured { background: var(--ink); color: var(--paper); }
  .quadrant.featured .q-id { color: var(--accent); }
  .quadrant.featured .q-name { color: var(--paper); }
  .quadrant.featured .q-sub { color: rgba(255,255,255,0.7); }
  .quadrant.featured .q-arrow { color: var(--accent); }
  .quadrant.featured:hover { background: var(--accent); color: var(--ink); }
  .quadrant.featured:hover .q-name,
  .quadrant.featured:hover .q-id,
  .quadrant.featured:hover .q-sub,
  .quadrant.featured:hover .q-arrow { color: var(--ink); }

  /* Scenario sections */
  .scenario {
    padding: 110px 0;
    border-top: 1px solid var(--ink-line);
  }
  .scenario-A { background: #18181A; }
  .scenario-B { background: #1F1A18; }
  .scenario-C { background: #181C1B; }
  .scenario-D {
    background: var(--accent);
    color: var(--ink);
  }
  .scenario-D .eyebrow { color: var(--ink); opacity: 0.6; }
  .scenario-D h2, .scenario-D h3, .scenario-D h4, .scenario-D strong { color: var(--ink); }
  .scenario-D p { color: var(--ink-soft); }
  .scenario-D .meta-label { color: rgba(29,29,28,0.55); }
  .scenario-D .bordered-block { border-color: rgba(29,29,28,0.15); }
  .scenario-D .stat .stat-label { color: rgba(29,29,28,0.55); }
  .scenario-D .stat .stat-value { color: var(--ink); }
  .scenario-D .pull-quote { color: var(--ink); border-color: rgba(29,29,28,0.25); }
  .scenario-D .bullets li { color: var(--ink-soft); }
  .scenario-D .bullets li strong { color: var(--ink); }
  .scenario-D .bullets li::marker { color: var(--ink); }
  .scenario-D .what-where-grid > div { border-color: rgba(29,29,28,0.15); }
  .scenario-D .what-where-grid h4 { color: var(--ink); }

  .scenario-head {
    display: grid; grid-template-columns: 1fr 1.4fr; gap: 4rem; align-items: end;
    margin-bottom: 4rem; padding-bottom: 2.5rem;
    border-bottom: 1px solid var(--ink-line);
  }
  .scenario-D .scenario-head { border-color: rgba(29,29,28,0.18); }
  .scenario-tag {
    display: inline-flex; align-items: center; gap: 12px;
  }
  .scenario-letter {
    font-family: var(--serif); font-size: 4.5rem; line-height: 0.85;
    font-weight: 400; color: var(--accent);
  }
  .scenario-D .scenario-letter { color: var(--ink); }
  .scenario-position {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(255,255,255,0.55);
    margin-bottom: 0.4rem;
  }
  .scenario-D .scenario-position { color: rgba(29,29,28,0.55); }
  .scenario-name {
    font-family: var(--serif); font-size: clamp(2.2rem, 5vw, 4rem); font-weight: 400;
    line-height: 1.0; letter-spacing: -0.025em;
  }
  .scenario-oneline {
    font-family: var(--serif); font-size: 1.55rem;
    line-height: 1.35; font-weight: 300; letter-spacing: -0.01em;
    color: rgba(255,255,255,0.92);
    max-width: 42ch; font-style: italic;
  }
  .scenario-D .scenario-oneline { color: var(--ink); }

  .scenario-body { display: grid; grid-template-columns: 1fr; gap: 3rem; max-width: 940px; }
  .scenario-body > section { padding-top: 0.5rem; }
  .scenario-body h3 {
    font-family: var(--serif); font-size: 1.55rem; margin-bottom: 1rem;
    letter-spacing: -0.01em;
  }
  .scenario-body h4 {
    font-family: var(--mono); font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 0.8rem;
  }
  .scenario-D .scenario-body h4 { color: var(--ink); opacity: 0.65; }

  /* Bullets and lists */
  .bullets { list-style: none; padding-left: 0; }
  .bullets li {
    padding-left: 1.6rem; position: relative;
    margin-bottom: 0.8rem; color: var(--ink-muted);
    line-height: 1.55; font-size: 0.98rem;
  }
  .bullets li::before {
    content: '→'; position: absolute; left: 0; top: 0;
    color: var(--accent); font-family: var(--mono); font-weight: 600;
  }
  .scenario-D .bullets li::before { color: var(--ink); opacity: 0.6; }

  /* Pull-quote */
  .pull-quote {
    font-family: var(--serif); font-size: 1.6rem; font-weight: 300;
    line-height: 1.35; letter-spacing: -0.01em;
    color: var(--paper);
    padding: 2rem 0 2rem 2rem;
    border-left: 3px solid var(--accent);
    margin: 1.5rem 0;
    max-width: 36ch;
  }

  /* Stat row */
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem;
    padding: 2.5rem 0; border-top: 1px solid var(--ink-line);
    border-bottom: 1px solid var(--ink-line);
  }
  .scenario-D .stats-grid { border-color: rgba(29,29,28,0.18); }
  .stat { }
  .stat-label {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    margin-bottom: 0.5rem;
  }
  .stat-value {
    font-family: var(--serif); font-size: 2.2rem; font-weight: 400;
    line-height: 1; color: var(--paper);
  }
  .stat-detail { margin-top: 0.5rem; font-size: 0.85rem; color: var(--ink-muted); line-height: 1.45; }

  /* What worked / what didn't */
  .what-where-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem;
    margin-top: 1.5rem;
  }
  .what-where-grid > div { padding-top: 1.25rem; border-top: 1px solid var(--ink-line); }

  /* Cross-scenario strategy */
  .strategy { background: #232322; border-top: 1px solid var(--ink-line); padding: 120px 0; }
  .strategy-grid {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 5rem;
  }
  .strategy-table {
    margin-top: 1.5rem;
    border: 1px solid var(--ink-line);
    border-radius: 8px;
    overflow: hidden;
  }
  .strategy-row {
    display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr;
    border-bottom: 1px solid var(--ink-line);
  }
  .strategy-row:last-child { border-bottom: none; }
  .strategy-row > div {
    padding: 1rem 1.2rem; font-size: 0.85rem;
    border-right: 1px solid var(--ink-line);
    display: flex; align-items: center;
  }
  .strategy-row > div:last-child { border-right: none; }
  .strategy-row.header > div {
    font-family: var(--mono); font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.03);
  }
  .strategy-row .strat-name { font-weight: 600; color: var(--paper); font-size: 0.9rem; }
  .grade {
    width: 38px; height: 22px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 0.7rem; font-weight: 600;
  }
  .grade.excellent { background: var(--accent); color: var(--ink); }
  .grade.strong { background: rgba(224,246,31,0.55); color: var(--ink); }
  .grade.moderate { background: rgba(167,126,90,0.55); color: var(--paper); }
  .grade.weak { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.55); }

  /* The strategic read */
  .strategic-read .pull-quote {
    font-size: 1.85rem; max-width: 38ch;
  }

  /* Closing tease */
  .closing {
    padding: 130px 0 100px;
    background: var(--ink);
    border-top: 1px solid var(--ink-line);
    text-align: left;
  }
  .closing .display { max-width: 18ch; margin-bottom: 1.5rem; }
  .closing .lead-large { max-width: 56ch; margin-bottom: 2.5rem; }
  .closing .signoff {
    margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--ink-line);
    display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 1.5rem;
  }
  .signoff .from {
    font-family: var(--mono); font-size: 0.7rem;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .signoff .for-block {
    text-align: right;
    font-family: var(--mono); font-size: 0.7rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .signoff .for-block .name { color: var(--accent); font-weight: 600; }

  /* Footer */
  footer {
    padding: 3rem 0; border-top: 1px solid var(--ink-line);
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.4);
    text-align: center;
  }

  /* Mobile */
  @media (max-width: 768px) {
    section { padding: 70px 0; }
    .wrap { padding: 0 22px; }
    .display { font-size: 2.4rem; }
    .hero .sub { font-size: 1.05rem; }
    .hero-meta { gap: 1.5rem; }
    .hero-meta > div { flex: 1 0 calc(50% - 0.75rem); }
    .frame-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    .frame-grid blockquote { font-size: 1.2rem; }
    .predets-grid { grid-template-columns: 1fr; }
    .axes-grid { grid-template-columns: 1fr; gap: 1.5rem; }
    .matrix-section { padding: 70px 0; }
    .matrix-axes { padding: 30px 0 30px 40px; }
    .axis-y { width: 40px; }
    .axis-x { padding-left: 40px; }
    .quadrant { padding: 1.75rem 1.4rem; min-height: 240px; }
    .q-name { font-size: 1.5rem; }
    .scenario-head { grid-template-columns: 1fr; gap: 2rem; align-items: start; }
    .scenario-letter { font-size: 3.2rem; }
    .scenario-name { font-size: 2.2rem; }
    .scenario-oneline { font-size: 1.2rem; }
    .scenario-body h3 { font-size: 1.3rem; }
    .stats-grid { grid-template-columns: 1fr; gap: 1.5rem; padding: 1.5rem 0; }
    .what-where-grid { grid-template-columns: 1fr; gap: 1.5rem; }
    .strategy-grid { grid-template-columns: 1fr; gap: 2rem; }
    .strategy-row { grid-template-columns: 1.6fr 1fr 1fr; }
    .strategy-row > div:nth-child(4),
    .strategy-row > div:nth-child(5) { display: none; }
    .pull-quote { font-size: 1.2rem; padding: 1.2rem 0 1.2rem 1.3rem; }
    .closing .display { font-size: 2.4rem; }
    .formula { font-size: 1.8rem; }
    .signoff { flex-direction: column; align-items: start; }
    .signoff .for-block { text-align: left; }
  }

  /* Reveal on scroll */
  .reveal {
    opacity: 0; transform: translateY(20px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  /* Password gate overlay */
  .gate-overlay {
    position: fixed;
    inset: 0;
    background: var(--ink);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
  }
  .gate-overlay::before {
    content: '';
    position: absolute;
    top: -10%; right: -15%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle at 30% 30%, rgba(224,246,31,0.08), transparent 60%);
    pointer-events: none;
  }
  .gate-inner {
    max-width: 440px;
    width: 100%;
    position: relative;
    z-index: 1;
  }
  .gate-inner h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 2.4rem;
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin-bottom: 0.85rem;
  }
  .gate-inner .sub {
    font-size: 1rem;
    line-height: 1.55;
    color: rgba(255,255,255,0.68);
    margin-bottom: 2.25rem;
  }
  .gate-inner .sub em { color: rgba(255,255,255,0.85); font-style: italic; }
  .gate-inner form { display: flex; flex-direction: column; gap: 0.85rem; }
  .gate-inner input[type="password"] {
    width: 100%;
    padding: 0.95rem 1rem;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 6px;
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .gate-inner input[type="password"]:focus { border-color: var(--accent); }
  .gate-inner button {
    padding: 0.95rem 1.25rem;
    background: var(--accent);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    font-family: var(--mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  .gate-inner button:hover { background: var(--accent-strong); }
  .gate-inner .err { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.4rem; display: none; }
  .gate-inner .meta {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.42);
  }
  .gate-inner .meta .for { color: rgba(255,255,255,0.7); }
  .report-content { display: none; }
  body.unlocked .report-content { display: block; }
  body.unlocked .gate-overlay { display: none; }
</style>
</head>

<script>
  // Password gate. AES-GCM decrypt of report body.
  function b64ToU8(b){ const bin = atob(b); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  async function tryUnlock(pw){
    try {
      const ct   = b64ToU8(document.getElementById('ct').textContent.trim());
      const salt = b64ToU8(document.getElementById('salt').textContent.trim());
      const iv   = b64ToU8(document.getElementById('iv').textContent.trim());
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
      const html = new TextDecoder().decode(buf);
      const container = document.createElement('div');
      container.className = 'report-content';
      container.innerHTML = html;
      document.body.appendChild(container);
      document.body.classList.add('unlocked');
      sessionStorage.setItem('s2g_pw', pw);
      return true;
    } catch(e) { return false; }
  }
  (async function(){
    const stored = sessionStorage.getItem('s2g_pw');
    if (stored) { await tryUnlock(stored); }
  })();
  document.getElementById('gate-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const v = document.getElementById('pw').value;
    const ok = await tryUnlock(v);
    if (!ok) {
      document.getElementById('err').style.display = 'block';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  });

  // Reveal on scroll
  const reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && reveals.length) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.15 });
    reveals.forEach(r => io.observe(r));
  }
</script>
